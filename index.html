<!DOCTYPE html>
<html lang="ko">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-P3WNGVZJYF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-P3WNGVZJYF');
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로또 추첨기</title>
<!-- Design system fonts (Real Estate Dark Theme: Urbanist + Inter) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* =========================================================
     Design tokens — extracted from the Figma .fig design system
     "Real Estate Business Website UI Template — Dark Theme"
     ========================================================= */
  :root {
    --bg:        #141414;  /* page background        */
    --surface:   #1A1A1A;  /* cards / sections       */
    --surface-2: #1E1E1E;  /* raised surface         */
    --border:    #262626;  /* hairline borders       */
    --border-2:  #423C5D;  /* accent-tinted border   */

    --accent:    #703BF7;  /* brand purple           */
    --accent-2:  #A685FA;  /* light purple           */

    --text:      #FFFFFF;  /* primary text           */
    --muted:     #999999;  /* secondary text         */
    --dim:       #666666;  /* tertiary text          */

    --radius-card: 14px;
    --radius-pill: 100px;
    --space:     24px;
    --font:      "Urbanist", "Inter", "Malgun Gothic", system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 80% -10%, rgba(112,59,247,.22), transparent 60%),
      radial-gradient(700px 400px at -10% 110%, rgba(166,133,250,.12), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: var(--font);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: 100%;
    max-width: 480px;
    background: linear-gradient(180deg, var(--surface), var(--surface-2));
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 36px 30px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55);
    text-align: center;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--accent-2);
    background: rgba(112,59,247,.12);
    border: 1px solid var(--border-2);
    padding: 6px 14px;
    border-radius: var(--radius-pill);
    margin-bottom: 18px;
  }
  .eyebrow .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 10px var(--accent-2);
  }

  h1 {
    font-size: 30px;
    font-weight: 700;
    letter-spacing: -.02em;
    margin-bottom: 8px;
  }
  h1 .accent {
    background: linear-gradient(120deg, var(--accent-2), var(--accent));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle { color: var(--muted); font-size: 14px; font-weight: 500; margin-bottom: 28px; }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,.02);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 14px;
  }
  .controls label { font-size: 14px; font-weight: 500; color: var(--muted); }
  select {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 14px;
    font-family: var(--font);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  select:focus { outline: none; border-color: var(--accent); }

  button {
    cursor: pointer;
    border: none;
    border-radius: var(--radius-pill);
    font-family: var(--font);
    font-weight: 700;
    transition: transform .1s ease, filter .15s ease, background .15s ease;
  }
  button:active { transform: scale(.98); }

  .btn-primary {
    width: 100%;
    padding: 15px 22px;
    font-size: 16px;
    color: #fff;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    box-shadow: 0 10px 30px rgba(112,59,247,.40);
    margin-bottom: 10px;
  }
  .btn-primary:hover { filter: brightness(1.07); }

  .btn-secondary {
    width: 100%;
    padding: 12px 18px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--border-2); }

  .results {
    margin-top: 26px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .game-row {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    padding: 12px 10px;
    background: rgba(255,255,255,.02);
    border: 1px solid var(--border);
    border-radius: 12px;
    animation: fadeIn .4s ease both;
  }
  .game-label {
    color: var(--accent-2);
    font-size: 12px;
    font-weight: 700;
    width: 22px;
    text-align: center;
    letter-spacing: .05em;
  }
  .ball {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    color: #fff;
    box-shadow: inset -3px -4px 6px rgba(0,0,0,.28), 0 4px 10px rgba(0,0,0,.35);
  }
  /* 번호 구간별 색상 (실제 로또 규칙) */
  .c1 { background: #fbc400; color: #4a3a00; } /* 1-10 노랑 */
  .c2 { background: #69c8f2; color: #0a3a4a; } /* 11-20 파랑 */
  .c3 { background: #ff7272; }                  /* 21-30 빨강 */
  .c4 { background: #555555; }                  /* 31-40 회색 */
  .c5 { background: #b0d840; color: #2a3a00; } /* 41-45 초록 */

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .empty {
    color: var(--dim);
    font-size: 14px;
    font-weight: 500;
    padding: 28px 0;
  }

  footer {
    margin-top: 28px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    color: var(--dim);
    font-size: 12px;
    font-weight: 500;
  }
</style>
</head>
<body>
  <div class="app">
    <span class="eyebrow"><span class="dot"></span>Lucky Draw</span>
    <h1>로또 <span class="accent">추첨기</span></h1>
    <p class="subtitle">1 ~ 45 중 서로 다른 6개의 번호를 무작위로 뽑습니다</p>

    <div class="controls">
      <label for="count">게임 수</label>
      <select id="count">
        <option value="1">1게임</option>
        <option value="3">3게임</option>
        <option value="5" selected>5게임</option>
        <option value="10">10게임</option>
      </select>
    </div>

    <button class="btn-primary" id="drawBtn">번호 뽑기</button>
    <button class="btn-secondary" id="clearBtn">초기화</button>

    <div class="results" id="results">
      <p class="empty">버튼을 눌러 행운의 번호를 받아보세요</p>
    </div>

    <footer>본 추첨기는 재미를 위한 도구이며 당첨을 보장하지 않습니다.</footer>
  </div>

<script>
  // 1~45 중 중복 없이 6개를 뽑아 오름차순으로 반환
  function drawOne() {
    const pool = Array.from({ length: 45 }, (_, i) => i + 1);
    const picked = [];
    for (let i = 0; i < 6; i++) {
      const idx = Math.floor(Math.random() * pool.length);
      picked.push(pool.splice(idx, 1)[0]);
    }
    return picked.sort((a, b) => a - b);
  }

  // 번호에 따른 색상 클래스
  function colorClass(n) {
    if (n <= 10) return "c1";
    if (n <= 20) return "c2";
    if (n <= 30) return "c3";
    if (n <= 40) return "c4";
    return "c5";
  }

  const resultsEl = document.getElementById("results");
  const countEl = document.getElementById("count");

  // Google Analytics: "번호 뽑기" 클릭 횟수 측정
  let drawCount = 0;
  function trackDraw(games) {
    drawCount += 1;
    if (typeof gtag === "function") {
      gtag("event", "draw_numbers", {
        game_count: games,        // 이번 추첨의 게임 수 (1/3/5/10)
        draw_index: drawCount,    // 이 세션에서 몇 번째 추첨인지
      });
    }
  }

  function render() {
    const games = parseInt(countEl.value, 10);
    trackDraw(games);
    resultsEl.innerHTML = "";
    for (let g = 0; g < games; g++) {
      const nums = drawOne();
      const row = document.createElement("div");
      row.className = "game-row";
      row.style.animationDelay = (g * 0.06) + "s";

      const label = document.createElement("span");
      label.className = "game-label";
      label.textContent = String.fromCharCode(65 + g); // A, B, C...
      row.appendChild(label);

      nums.forEach((n) => {
        const ball = document.createElement("span");
        ball.className = "ball " + colorClass(n);
        ball.textContent = n;
        row.appendChild(ball);
      });
      resultsEl.appendChild(row);
    }
  }

  function clear() {
    resultsEl.innerHTML = '<p class="empty">버튼을 눌러 행운의 번호를 받아보세요</p>';
  }

  document.getElementById("drawBtn").addEventListener("click", render);
  document.getElementById("clearBtn").addEventListener("click", clear);
</script>
</body>
</html>
